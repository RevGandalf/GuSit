<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIP Gunungsitoli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{--paper:#f5f0e6;--sheet:#fbf8f1;--ink:#1f1c17;--mute:#6b6354;--rule:#d8cebb;--red:#b3261e;--grn:#2f6b3f;--och:#8f5f08;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171512;--sheet:#201d18;--ink:#ece5d6;--mute:#a49b88;--rule:#3a352b;--red:#f08a7e;--grn:#8cc79a;--och:#e0b050}}
:root[data-theme="dark"]{--paper:#171512;--sheet:#201d18;--ink:#ece5d6;--mute:#a49b88;--rule:#3a352b;--red:#f08a7e;--grn:#8cc79a;--och:#e0b050}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
header .wrap{padding-top:16px;border-bottom:2px solid var(--ink)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:6px}
.mo{position:relative;display:inline-block;margin:0;color:var(--ink);font:600 32px/1.1 var(--serif);letter-spacing:-.01em}
.mo::after{content:" ▾";font-size:16px;color:var(--mute)}
.mo select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;border:0}
.mo:focus-within{outline:2px solid var(--red);outline-offset:3px}
#sync{font:11.5px var(--mono);color:var(--mute)}
input,select,textarea{width:100%;font:16px/1.3 system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:10px 0}
textarea{border:1px solid var(--ink);padding:8px}
input[type=number],input[type=date],input[type=month]{font-family:var(--mono)}
#chips{display:flex;gap:20px}
#chips button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0 7px;font:500 13px var(--mono);color:var(--mute);cursor:pointer;border-radius:0}
#chips button.on{color:var(--ink);border-bottom-color:var(--ink)}
main.wrap{padding-bottom:96px}
small{font:12px/1.35 var(--mono);color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 0;cursor:pointer}
.row b{display:block;font:600 18px/1.2 var(--serif)}
.row small{display:block;margin-top:3px}
.r{text-align:right;flex-shrink:0}
.st{font:500 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.ok{color:var(--grn)}.no{color:var(--red)}.pa{color:var(--och)}.na{color:var(--mute)}
.lede{padding:26px 0 18px}
.fig{font:500 clamp(54px,17vw,84px)/.95 var(--serif);letter-spacing:-.02em}
.cap{font:13px var(--mono);color:var(--mute);margin-top:8px}
.lede p{margin:14px 0 0}.lede p b{font:500 15px var(--mono)}
.btn{border:1px solid var(--ink);background:transparent;padding:10px 14px;font:500 14px system-ui,sans-serif;cursor:pointer;border-radius:0}
.btn:active{background:var(--ink);color:var(--paper)}
.bar{padding:14px 0 6px}.note{margin:8px 0 0;display:block}
h2{font:600 22px/1.1 var(--serif);margin:34px 0 4px;padding-top:12px;border-top:2px solid var(--ink)}
h2 .cnt{font:400 12px var(--mono);color:var(--mute);margin-left:6px}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:12px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl thead th{padding-left:12px;font:500 11.5px var(--mono);color:var(--mute);text-align:right;border-bottom:1px solid var(--ink)}
.tbl thead th:first-child,.tbl tbody th{text-align:left}
.tbl tbody th{font:600 17px/1.2 var(--serif)}
.tbl th small{display:block;font-weight:400;margin-top:3px}
.tbl td{text-align:right;font:14px var(--mono);padding-left:10px;font-variant-numeric:tabular-nums}
.tbl td small{display:block}
.tbl tfoot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:500}
.tbl tfoot td:first-child{padding-left:0;text-align:left;font:600 15px var(--serif)}
.empty{padding:36px 0;color:var(--mute)}.empty p{font:600 22px var(--serif);margin:0 0 14px;color:var(--ink)}.empty .btn{margin:0 8px 8px 0}
details{border-top:2px solid var(--ink);margin-top:34px;padding-top:12px}summary{font:600 22px var(--serif);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(20,18,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sh{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-top:3px solid var(--ink);padding:16px 18px 0}
.sh:focus{outline:none}
.sh>*:last-child{margin-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.hd b{font:600 24px/1.1 var(--serif)}
.x{background:none;border:0;border-bottom:1px solid var(--ink);padding:2px 0;font:12px var(--mono);cursor:pointer;border-radius:0;white-space:nowrap}
.lnk{background:none;border:0;border-bottom:1px solid currentColor;padding:2px 0;font:13px var(--mono);cursor:pointer;margin-top:18px;border-radius:0}
label{display:block;font-size:12.5px;color:var(--mute);margin:16px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.mt{margin-top:10px}
.seg{display:flex;border:1px solid var(--ink);margin-top:8px}
.seg button{flex:1;padding:11px 2px;border:0;border-right:1px solid var(--ink);background:transparent;font:500 14px var(--mono);cursor:pointer;border-radius:0}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:var(--paper)}
.qa{display:flex;gap:8px;margin:8px 0 0}
.qa button{flex:1;padding:9px 2px;border:1px solid var(--ink);background:transparent;font:500 13px var(--mono);cursor:pointer;border-radius:0}
.qa button:active{background:var(--ink);color:var(--paper)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding:10px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.tot span{font:600 16px var(--serif)}.tot b{font:500 26px var(--mono)}
#pf_note{margin:12px 0 0;font-size:14px}
.act{position:sticky;bottom:0;background:var(--sheet);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--rule)}
.big{width:100%;padding:15px;border:0;background:var(--ink);color:var(--paper);font:600 17px var(--serif);cursor:pointer;border-radius:0}
.big:active{opacity:.85}
h4{font:600 16px var(--serif);margin:22px 0 2px;padding-top:10px;border-top:1px solid var(--ink)}
.hr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;max-width:220px;padding:14px 4px 13px;border:0;background:none;color:var(--mute);font:600 15px var(--serif);cursor:pointer;border-radius:0}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--red)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92%;background:var(--ink);color:var(--paper);padding:10px 14px;font:13px var(--mono);opacity:0;pointer-events:none;z-index:30}
#toast.on{opacity:1}
</style></head><body>
<header><div class="wrap">
  <div class="mast"><label class="mo"><span id="molabel"></span><select id="mon" aria-label="Month" onchange="curM=this.value;render()"></select></label><span id="sync" role="status"></span></div>
  <input id="q" type="search" aria-label="Search student name" placeholder="Search student name" oninput="render()" autocomplete="off">
  <div id="chips"></div>
</div></header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<nav aria-label="Sections">
  <button data-t="pay" onclick="go('pay')">Pay</button>
  <button data-t="sum" onclick="go('sum')">Summary</button>
  <button data-t="stu" onclick="go('stu')">Students</button>
</nav>
<div id="sh" class="ov" hidden onclick="if(event.target===this)closeSh()"><div class="sh" id="shin" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=new Date(),today=D.getFullYear()+'-'+pad(D.getMonth()+1)+'-'+pad(D.getDate());
const mi=k=>{const p=k.split('-');return +p[0]*12+ +p[1]-1},fm=i=>Math.floor(i/12)+'-'+pad(i%12+1);
const mlong=k=>{const p=k.split('-');return new Date(+p[0],p[1]-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})};
const ml=k=>{const p=k.split('-');return new Date(+p[0],p[1]-1,1).toLocaleDateString(undefined,{month:'short',year:'numeric'})};
const r2=x=>Math.round(x*100)/100,money=x=>(+x).toLocaleString(undefined,{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF={nf:120,of:100,lf:15,ld:10,d3:20,d6:50,d12:120,start:today.slice(0,7),tch:[{n:'Teacher A',b:0,p:40},{n:'Teacher B',b:0,p:40}]};
const LS={g:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let S=[],C={...DEF},db=null,ready=false,tab='pay',flt='act',curM=today.slice(0,7),ps,es,armed=null;

async function init(){
  try{if(window.claude)db=await claude.use('db')}catch(e){}
  if(db){
    const bad=e=>{ready=true;render();toast('Cannot read shared data: '+((e&&(e.code||e.message))||''),7000)};
    db.collection('students').onSnapshot(sn=>{S=sn.docs.map(d=>({...d.data(),id:d.id}));ready=true;render()},bad);
    db.doc('meta/cfg').onSnapshot(sn=>{if(sn.exists)C={...DEF,...sn.data()};render()},bad);
  }else{S=LS.g('tt_s')||[];C={...DEF,...(LS.g('tt_c')||{})};ready=true;render()}
}
const clean=o=>JSON.parse(JSON.stringify(o));
const why=e=>(e&&(e.message||e.code))||'no permission';
function dbSet(ref,data){
  return Promise.race([Promise.resolve().then(()=>ref().set(clean(data))).then(()=>true),new Promise(r=>setTimeout(()=>r(true),5000))])
    .catch(e=>{toast('Not saved: '+why(e),7000);return false})}
function save(s){const i=S.findIndex(x=>x.id===s.id);if(i<0)S.push(s);else S[i]=s;render();
  if(!db){const ok=LS.s('tt_s',S);if(!ok)toast('This browser blocked saving',7000);return Promise.resolve(ok)}
  return dbSet(()=>db.collection('students').doc(s.id),s)}
function rm(s){S=S.filter(x=>x.id!==s.id);render();
  if(!db){LS.s('tt_s',S);return}
  Promise.resolve().then(()=>db.collection('students').doc(s.id).delete()).catch(e=>toast('Not deleted: '+why(e),7000))}
function saveC(){render();if(!db){LS.s('tt_c',C);return}dbSet(()=>db.doc('meta/cfg'),C)}

/* ---------- fee logic ---------- */
const fee=s=>s.st==='NEW'?C.nf:C.of, disc=n=>n===1?0:(+C['d'+n]||0);
function active(s,M){const j=s.join?s.join.slice(0,7):'0000-01';
  return mi(j)<=mi(M)&&(s.st!=='QUIT'||(!!s.quit&&mi(s.quit.slice(0,7))>=mi(M)))}
function mInfo(s,M){let due=0,paid=0,cov=false,lump=false;const x=mi(M);
  for(const p of s.pays||[]){const a=mi(p.m);if(a<=x&&x<a+p.n){cov=true;due+=p.due/p.n;paid+=p.amt/p.n;if(p.n>1)lump=true}}
  const act=active(s,M);if(!cov&&act)due=fee(s);
  const bal=r2(due-paid);let t;
  if(!act&&!cov)t='na';else if(bal<=0)t='paid';else t=paid>0?'part':'unpaid';
  return{due,paid,bal,t,act,cov,lump}}
function owed(s,M){let a=Math.max(s.join?mi(s.join.slice(0,7)):0,mi(C.start)),b=mi(M);
  if(s.st==='QUIT')b=Math.min(b,s.quit?mi(s.quit.slice(0,7)):-1);
  let o=0;for(let i=a;i<=b;i++)o+=mInfo(s,fm(i)).bal;return r2(o)}

const CH={paid:['Paid ✓','ok'],part:['Partial','pa'],unpaid:['Unpaid','no'],na:['—','na']};
const chip=(t,l)=>`<span class="st ${CH[t][1]}">${CH[t][0]}${l?' · lump':''}</span>`;
function monOpts(sel){const lo=Math.min(mi(C.start),mi(today)-6,mi(sel)),hi=Math.max(mi(today)+12,mi(sel));let h='';
  for(let i=lo;i<=hi;i++)h+=`<option value="${fm(i)}"${fm(i)===sel?' selected':''}>${ml(fm(i))}</option>`;return h}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms||2200)}
let lastF=null;
function sheet(h){const o=$('#sh'),first=o.hidden;if(first)lastF=document.activeElement;$('#shin').innerHTML=h;if(first){o.hidden=false;$('#shin').focus()}}
function closeSh(){$('#sh').hidden=true;armed=null;if(lastF&&lastF.focus)lastF.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sh').hidden)closeSh()});
function arm(k,fn){if(armed===k){armed=null;fn()}else{armed=k;toast('Tap again to confirm')}}
function go(t){tab=t;if(t==='stu'&&flt==='unpaid')flt='act';render()}
function setF(f){flt=f;render()}

function render(){
  if(!ready){return}
  $('#mon').innerHTML=monOpts(curM);$('#molabel').textContent=mlong(curM);$('#sync').textContent=db?'shared · live':'this device only';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#q').style.display=tab==='sum'?'none':'';
  const ch=tab==='pay'?[['act','Active'],['unpaid','Unpaid'],['all','All']]:tab==='stu'?[['act','Active'],['all','All incl. quit']]:[];
  $('#chips').innerHTML=ch.map(c=>`<button class="${flt===c[0]?'on':''}" onclick="setF('${c[0]}')">${c[1]}</button>`).join('');
  $('#main').innerHTML=tab==='pay'?vPay():tab==='sum'?vSum():vStu();
}
const sample=()=>{const t=C.tch.map(x=>x.n);[['Alice Tan','OLD'],['Ben Lim','NEW'],['Chloe Wong','OLD']].forEach((a,i)=>save({id:uid(),name:a[0],par:'',tch:t[i%t.length]||'',st:a[1],join:today,quit:'',pays:[]}))};
const emptyMsg=`<div class="empty"><p>No students yet.</p><button class="btn" onclick="openStu()">+ Add first student</button><button class="btn" onclick="sample()">Load 3 sample students</button></div>`;
const qv=()=>$('#q').value.trim().toLowerCase();

/* ---------- PAY tab ---------- */
function vPay(){
  if(!S.length)return emptyMsg;
  let L=S.filter(s=>s.name.toLowerCase().includes(qv())).map(s=>({s,i:mInfo(s,curM),o:owed(s,curM)}));
  if(flt==='act')L=L.filter(x=>x.i.act||x.i.cov);
  if(flt==='unpaid')L=L.filter(x=>x.i.t==='unpaid'||x.i.t==='part'||x.o>0);
  L.sort((a,b)=>a.s.name.localeCompare(b.s.name));
  if(!L.length)return'<div class="empty">No students found</div>';
  return L.map(x=>`<button class="row" onclick="openPay('${x.s.id}')"><span><b>${esc(x.s.name)}</b><small>${esc(x.s.tch||'No teacher')} · ${x.s.st}</small></span><span class="r">${chip(x.i.t,x.i.lump&&x.i.t==='paid')}${x.o>0?`<small class="no">owes ${money(x.o)}</small>`:''}</span></button>`).join('')}

function payAuto(){const t=ps.t;
  if(!t.disc)ps.disc=disc(ps.n);
  if(!t.fine)ps.fine=ps.d>ps.m+'-'+pad(C.ld)?C.lf:0;
  ps.total=Math.max(0,r2(ps.fee*ps.n-ps.disc+ps.fine));
  if(!t.paid)ps.paid=ps.total}
const ins=p=>p.ins||[{d:p.d,a:p.amt}];
const openRecs=s=>(s.pays||[]).filter(p=>r2(p.due-p.amt)>0).sort((a,b)=>mi(a.m)-mi(b.m));
const rng=p=>ml(p.m)+(p.n>1?' → '+ml(fm(mi(p.m)+p.n-1)):'');
function openPay(id){const s=S.find(x=>x.id===id),R=openRecs(s),x=mi(curM),c=R.find(p=>mi(p.m)<=x&&x<mi(p.m)+p.n)||R[0];
  ps={s,m:curM,n:1,d:today,t:{},fee:fee(s),mode:R.length?'bal':'new',rec:c&&c.id,ba:null};payAuto();showPay()}
function pm(k,v){ps[k]=k==='n'?+v:v;payAuto();showPay()}
function pset(k,v){ps[k]=+v||0;ps.t[k]=true;payAuto();updPay()}
function paidSet(half){if(half){ps.paid=r2(ps.total/2);ps.t.paid=true}else{ps.t.paid=false;payAuto()}updPay()}
const recOf=()=>{const R=openRecs(ps.s);return R.find(x=>x.id===ps.rec)||R[0]};
function updPay(){for(const k of['fee','disc','fine','paid']){const e=$('#pf_'+k);if(e&&document.activeElement!==e)e.value=ps[k]}
  $('#pf_total').textContent=money(ps.total);
  const b=r2(ps.total-ps.paid);
  $('#pf_note').innerHTML=`Covers ${rng({m:ps.m,n:ps.n})} · `+(b>0?`<b class="no">Balance still owed ${money(b)}</b>`:b<0?`<b class="ok">Overpaid ${money(-b)}</b>`:'<b class="ok">Fully paid</b>')}
function updBa(){const p=recOf(),b=r2(p.due-p.amt),r=r2(b-(ps.ba==null?b:ps.ba));
  $('#pf_note').innerHTML=r>0?`After this: <b class="no">still owes ${money(r)}</b>`:r<0?`<b class="ok">Overpaid ${money(-r)}</b>`:'<b class="ok">Fully paid after this</b>'}
function baSet(v){ps.ba=v;showPay()}
const AL={fee:'Fee per month',disc:'Lump discount',fine:'Late fine',paid:'Amount paid'};
const num=(id,k)=>`<input id="pf_${k}" aria-label="${AL[k]}" type="number" inputmode="decimal" step="any" value="${ps[k]}" oninput="pset('${k}',this.value)">`;
function newForm(){return`<label>Pay for month</label><select onchange="pm('m',this.value)">${monOpts(ps.m)}</select>
  <label>Months paid (lump)</label><div class="seg">${[1,3,6,12].map(n=>`<button class="${ps.n===n?'on':''}" onclick="pm('n',${n})">${n===1?'1 mo':n+' mo'}</button>`).join('')}</div>
  <div class="g2"><div><label>Fee / month</label>${num('fee','fee')}</div><div><label>Lump discount</label>${num('disc','disc')}</div></div>
  <div class="g2"><div><label>Late fine</label>${num('fine','fine')}</div><div><label>Date paid</label><input type="date" value="${ps.d}" onchange="pm('d',this.value||today)"></div></div>
  <div class="tot"><span>Total due</span><b id="pf_total"></b></div>
  <label>Amount paid now (pay less if only part)</label>
  <div class="qa"><button onclick="paidSet(0)">Full</button><button onclick="paidSet(1)">Half</button></div>${num('paid','paid')}
  <div id="pf_note"></div><div class="act"><button class="big" onclick="paySave()">Save payment</button></div>`}
function balForm(){const R=openRecs(ps.s),p=recOf(),b=r2(p.due-p.amt);ps.rec=p.id;
  return`<label>Which payment is being topped up</label><select onchange="ps.rec=this.value;ps.ba=null;showPay()">${R.map(x=>`<option value="${x.id}"${x.id===p.id?' selected':''}>${rng(x)} · owes ${money(r2(x.due-x.amt))} of ${money(x.due)}</option>`).join('')}</select>
  <label>Paying now</label><div class="qa"><button onclick="baSet(${b})">Full ${money(b)}</button><button onclick="baSet(${r2(b/2)})">Half ${money(r2(b/2))}</button></div>
  <input id="pf_ba" aria-label="Amount paying now" type="number" inputmode="decimal" step="any" value="${ps.ba==null?b:ps.ba}" oninput="ps.ba=+this.value||0;updBa()">
  <label>Date paid</label><input type="date" value="${ps.d}" onchange="ps.d=this.value||today">
  <div id="pf_note"></div><div class="act"><button class="big" onclick="balSave()">Add this payment</button></div>`}
function showPay(){const s=ps.s,i=mInfo(s,curM),o=owed(s,curM),R=openRecs(s);if(!R.length)ps.mode='new';
  const hist=(s.pays||[]).slice().sort((a,b)=>mi(b.m)-mi(a.m)).map(p=>`<div class="hr"><span>${rng(p)}<br><small>paid ${money(p.amt)} of ${money(p.due)}${ins(p).length>1?' ('+ins(p).length+' payments)':''}${p.fine?' · fine '+money(p.fine):''}${p.disc?' · lump −'+money(p.disc):''}</small></span><button class="x" onclick="arm('p${p.id}',()=>payDel('${p.id}'))">Remove</button></div>`).join('')||'<small>No payments yet</small>';
  sheet(`<div class="hd"><b>${esc(s.name)}</b><button class="x" onclick="closeSh()">Close</button></div>
  <small>${esc(s.tch||'No teacher')} · ${s.st} · ${ml(curM)}: ${chip(i.t)}${o>0?` · owes <b class="no">${money(o)}</b> in total`:''}</small>
  ${R.length?`<div class="seg mt"><button class="${ps.mode==='bal'?'on':''}" onclick="pm('mode','bal')">Pay balance</button><button class="${ps.mode==='new'?'on':''}" onclick="pm('mode','new')">New payment</button></div>`:''}
  ${ps.mode==='bal'?balForm():newForm()}
  <h4>Payment history</h4>${hist}`);ps.mode==='bal'?updBa():updPay()}
function paySave(){if(!(ps.paid>0)){toast('Enter the amount paid');return}const s=ps.s;
  const rec={id:uid(),m:ps.m,n:ps.n,d:ps.d,fee:ps.fee,disc:ps.disc,fine:ps.fine,due:ps.total,amt:ps.paid,ins:[{d:ps.d,a:ps.paid}]};
  (s.pays=s.pays||[]).push(rec);
  save(s).then(ok=>{if(ok){closeSh();toast('Saved ✓ '+s.name)}else{s.pays=s.pays.filter(p=>p!==rec);render()}})}
function balSave(){const p=recOf(),b=r2(p.due-p.amt),a=ps.ba==null?b:ps.ba;if(!(a>0)){toast('Enter the amount paid');return}
  const o={ins:p.ins,amt:p.amt};p.ins=ins(p).concat({d:ps.d,a});p.amt=r2(p.amt+a);
  save(ps.s).then(ok=>{if(ok){closeSh();toast('Saved ✓ '+ps.s.name)}else{p.ins=o.ins;p.amt=o.amt;render()}})}
function payDel(id){const s=ps.s;s.pays=s.pays.filter(p=>p.id!==id);save(s).then(()=>showPay())}

function vSum(){
  if(!S.length)return emptyMsg;
  const A=S.map(s=>({s,i:mInfo(s,curM),o:owed(s,curM)})),sm=(L,f)=>r2(L.reduce((a,x)=>a+f(x),0));
  const names=C.tch.map(t=>t.n);if(A.some(x=>x.i.act&&!names.includes(x.s.tch||'')))names.push('');
  let tot=0;
  const T=names.map(n=>{const tc=C.tch.find(t=>t.n===n)||{b:0,p:0},all=A.filter(x=>(x.s.tch||'')===n),L=all.filter(x=>x.i.act),sal=(+tc.b||0)+(+tc.p||0)*L.length;tot+=sal;
    const jn=all.filter(x=>x.s.join&&x.s.join.slice(0,7)===curM).length,qt=all.filter(x=>x.s.st==='QUIT'&&x.s.quit&&x.s.quit.slice(0,7)===curM).length,up=L.filter(x=>x.i.t==='unpaid'||x.i.t==='part').length;
    const note=[L.filter(x=>x.s.st==='NEW').length+' new',L.filter(x=>x.s.st==='OLD').length+' old',up+' unpaid'].concat(jn?[jn+' joined']:[],qt?[qt+' quit']:[]).join(' · ');
    return`<tr><th scope="row">${esc(n||'No teacher')}<small>${note}</small></th><td>${L.length}</td><td>${money(sm(all,x=>x.i.paid))}<small>of ${money(sm(all,x=>x.i.due))}</small></td><td>${money(sal)}</td></tr>`}).join('');
  const O=A.filter(x=>x.o>0).sort((a,b)=>(a.s.tch||'').localeCompare(b.s.tch||'')||a.s.name.localeCompare(b.s.name));
  return`<section class="lede"><div class="fig">${money(sm(A,x=>x.i.paid))}</div><div class="cap">collected of ${money(sm(A,x=>x.i.due))} due in ${mlong(curM)}</div>
  <p><b class="no">${money(sm(A,x=>Math.max(0,x.i.bal)))}</b> still unpaid this month. <b class="no">${money(sm(O,x=>x.o))}</b> owed across all months.</p></section>
  <button class="btn" onclick="exportXlsx()">Export ${ml(curM)} to Excel</button><small class="note">Sheet 1 lists everyone. Each teacher then gets a sheet with an archive of earlier months.</small>
  <h2>Teachers</h2><table class="tbl"><thead><tr><th>Teacher</th><th>Students</th><th>Collected</th><th>Salary</th></tr></thead><tbody>${T}</tbody><tfoot><tr><td colspan="3">Total salaries</td><td>${money(tot)}</td></tr></tfoot></table>
  <h2>Parents who owe<span class="cnt">${O.length}</span></h2>${O.map(x=>`<button class="row" onclick="openPay('${x.s.id}')"><span><b>${esc(x.s.name)}</b><small>${esc(x.s.tch||'No teacher')}</small></span><b class="no amt">${money(x.o)}</b></button>`).join('')||'<div class="empty">Nobody owes anything.</div>'}`}

function vStu(){
  const L=S.filter(s=>s.name.toLowerCase().includes(qv())&&(flt==='all'||s.st!=='QUIT')).sort((a,b)=>a.name.localeCompare(b.name));
  const cls={NEW:'pa',OLD:'na',QUIT:'no'};
  return`<div class="bar"><button class="btn" onclick="openStu()">+ Add student</button></div>`+
  (L.map(s=>`<button class="row" onclick="openStu('${s.id}')"><span><b>${esc(s.name)}</b><small>${esc(s.tch||'No teacher')}${s.par?' · '+esc(s.par):''}</small></span><span class="st ${cls[s.st]}">${s.st}</span></button>`).join('')||(S.length?'<div class="empty">No students found</div>':emptyMsg))+
  `<details><summary>⚙ Fees, teachers &amp; salary</summary>
  <div class="g2"><div><label>NEW fee / month</label><input id="c_nf" type="number" inputmode="decimal" value="${C.nf}"></div><div><label>OLD fee / month</label><input id="c_of" type="number" inputmode="decimal" value="${C.of}"></div>
  <div><label>Late fine</label><input id="c_lf" type="number" inputmode="decimal" value="${C.lf}"></div><div><label>Late after day of month</label><input id="c_ld" type="number" inputmode="numeric" value="${C.ld}"></div>
  <div><label>Discount 3 months</label><input id="c_d3" type="number" inputmode="decimal" value="${C.d3}"></div><div><label>Discount 6 months</label><input id="c_d6" type="number" inputmode="decimal" value="${C.d6}"></div>
  <div><label>Discount 12 months</label><input id="c_d12" type="number" inputmode="decimal" value="${C.d12}"></div><div><label>Track arrears from</label><input id="c_start" type="month" value="${C.start}"></div></div>
  <label>Teachers - one per line: name, base salary, pay per student (don't rename a teacher already in use)</label>
  <textarea id="c_tch" rows="5">${esc(C.tch.map(t=>[t.n,t.b,t.p].join(', ')).join('\n'))}</textarea>
  <button class="btn" onclick="cfgSave()">Save settings</button></details>`}
function cfgSave(){const g=i=>+$('#c_'+i).value||0;
  C={...C,nf:g('nf'),of:g('of'),lf:g('lf'),ld:g('ld')||10,d3:g('d3'),d6:g('d6'),d12:g('d12'),start:$('#c_start').value||C.start,
  tch:$('#c_tch').value.split('\n').map(l=>l.split(',').map(x=>x.trim())).filter(a=>a[0]).map(a=>({n:a[0],b:+a[1]||0,p:+a[2]||0}))};
  saveC();toast('Settings saved ✓')}
function openStu(id){es=id?clean(S.find(x=>x.id===id)):{id:uid(),name:'',par:'',tch:(C.tch[0]||{}).n||'',st:'NEW',join:today,quit:'',pays:[],nw:1};showStu()}
function showStu(){
  sheet(`<div class="hd"><b>${es.nw?'Add student':'Update student'}</b><button class="x" onclick="closeSh()">Close</button></div>
  <label>Student name</label><input aria-label="Student name" value="${esc(es.name)}" oninput="es.name=this.value" autocomplete="off">
  <label>Parent / contact</label><input aria-label="Parent or contact" value="${esc(es.par)}" oninput="es.par=this.value">
  <label>Teacher</label><select aria-label="Teacher" onchange="es.tch=this.value">${[''].concat(C.tch.map(t=>t.n)).map(n=>`<option value="${esc(n)}"${n===es.tch?' selected':''}>${esc(n||'— none —')}</option>`).join('')}</select>
  <label>Status</label><div class="seg">${['NEW','OLD','QUIT'].map(x=>`<button class="${es.st===x?'on':''}" onclick="stSet('${x}')">${x}</button>`).join('')}</div>
  <div class="g2"><div><label>Join date</label><input type="date" value="${es.join||''}" onchange="es.join=this.value"></div>
  ${es.st==='QUIT'?`<div><label>Quit date</label><input type="date" value="${es.quit||''}" onchange="es.quit=this.value"></div>`:''}</div>
  <div class="act"><button class="big" onclick="stuSave()">Save</button></div>
  ${es.nw?'':`<button class="lnk no" onclick="arm('del',stuDel)">Delete student and payments</button>`}`)}
function stSet(x){es.st=x;if(x==='QUIT'&&!es.quit)es.quit=today;showStu()}
function stuSave(){if(!es.name.trim()){toast('Enter a name');return}
  es.name=es.name.trim();const was=es.nw;delete es.nw;save(es).then(ok=>{if(ok){closeSh();toast('Saved ✓')}else if(was)es.nw=1})}
function stuDel(){rm(es);closeSh();toast('Deleted')}

const XH={font:{bold:true,color:{rgb:'FFFFFF'},name:'Arial',sz:10},fill:{fgColor:{rgb:'1F3864'}},alignment:{horizontal:'center',vertical:'center',wrapText:true}};
const XF={paid:'C6EFCE',part:'FFEB9C',unpaid:'FFC7CE'},XL={paid:'PAID',part:'PARTIAL',unpaid:'UNPAID',na:''};
const xb={font:{bold:true,name:'Arial',sz:10}},xt={font:{bold:true,sz:13,name:'Arial',color:{rgb:'1F3864'}}};
const xc=(v,o,z)=>({v:v,t:typeof v==='number'?'n':'s',s:Object.assign({font:{name:'Arial',sz:10}},o||{}),z:z||(typeof v==='number'?'#,##0.00':undefined)});
function buildWb(){
  const M=curM,sk=(a,b)=>(a.s.tch||'').localeCompare(b.s.tch||'')||a.s.name.localeCompare(b.s.name);
  const A=S.map(s=>({s,i:mInfo(s,M),o:owed(s,M)})).filter(x=>x.i.act||x.i.cov||x.o>0).sort(sk);
  const lab=x=>x.i.t==='paid'&&x.i.lump?'PAID (lump)':XL[x.i.t];
  const fill=t=>({alignment:{horizontal:'center'},fill:XF[t]?{fgColor:{rgb:XF[t]}}:undefined});
  const H=a=>a.map(t=>xc(t,XH)),HD=['Teacher','Student','Parent / contact','Status','Fee due','Paid','Balance','Payment','Total owed to date'];
  const body=(L,wt)=>L.map(x=>[...(wt?[xc(x.s.tch||'(none)')]:[]),xc(x.s.name),xc(x.s.par||''),xc(x.s.st),xc(r2(x.i.due)),xc(r2(x.i.paid)),xc(r2(x.i.bal)),xc(lab(x),fill(x.i.t)),xc(x.o,x.o>0?{fill:{fgColor:{rgb:XF.unpaid}}}:{})]);
  const tot=(L,k)=>{const sm=f=>xc(r2(L.reduce((a,x)=>a+f(x),0)),xb);return[...Array(k).keys()].map(j=>xc(j===k-1?'TOTAL':'',xb)).concat([sm(x=>x.i.due),sm(x=>x.i.paid),sm(x=>x.i.bal),xc('',xb),sm(x=>x.o)])};
  const mk=(rows,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(n=>({wch:n}));return ws};
  const used={},nm=n=>{const b=(n||'No teacher').replace(/[\\\/?*\[\]:]/g,'').slice(0,28)||'Sheet';let r=b,k=2;while(used[r.toLowerCase()])r=b+' '+k++;used[r.toLowerCase()]=1;return r};
  const wbk=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wbk,mk([[xc('Tuition summary - '+ml(M),xt)],[],H(HD),...body(A,1),tot(A,4)],[16,24,20,9,12,12,12,14,16]),nm('All students'));
  const names=C.tch.map(t=>t.n);if(A.some(x=>!names.includes(x.s.tch||'')))names.push('');
  const months=[];for(let i=mi(C.start);i<mi(M);i++)months.push(fm(i));
  names.forEach(n=>{
    const L=A.filter(x=>(x.s.tch||'')===n),tc=C.tch.find(t=>t.n===n)||{b:0,p:0},act=L.filter(x=>x.i.act).length,sal=(+tc.b||0)+(+tc.p||0)*act;
    const rows=[[xc((n||'No teacher')+' - '+ml(M),xt)],[],H(HD.slice(1)),...body(L,0),tot(L,3),[],
      [xc('Active students',xb),xc(act,null,'0')],[xc('Base salary',xb),xc(+tc.b||0)],[xc('Pay per student',xb),xc(+tc.p||0)],[xc('SALARY',xb),xc(sal,xb)],[],
      [xc('ARCHIVE - earlier months (paid / due)',xt)]];
    if(!months.length)rows.push([xc('No earlier months yet (tracking starts '+ml(C.start)+')')]);
    else{rows.push(H(['Student',...months.map(ml),'Owed to date']));
      S.filter(s=>(s.tch||'')===n).map(s=>({s,m:months.map(k=>mInfo(s,k))})).filter(r=>r.m.some(i=>i.t!=='na')).sort((a,b)=>a.s.name.localeCompare(b.s.name))
       .forEach(r=>{const o=owed(r.s,M);rows.push([xc(r.s.name),...r.m.map(i=>i.t==='na'?xc(''):xc(money(i.paid)+' / '+money(i.due),fill(i.t))),xc(o,o>0?{fill:{fgColor:{rgb:XF.unpaid}}}:{})])})}
    XLSX.utils.book_append_sheet(wbk,mk(rows,[24,18,12,12,12,12,14,16].concat(months.map(()=>14))),nm(n));
  });
  return wbk}
async function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('Excel library did not load');return}
  if(!S.length){toast('No students yet');return}
  const fn='Tuition_'+curM+'.xlsx';let dl=null;
  try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
  try{const out=XLSX.write(buildWb(),{bookType:'xlsx',type:'array'});
    if(dl){await dl.save({filename:fn,data:out})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download=fn;a.click()}
    toast('Exported ✓')}catch(e){if(!e||e.code!=='declined')toast('Export failed')}}
init();
</script></body></html>
